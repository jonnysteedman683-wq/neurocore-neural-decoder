[tool.poetry]
name = "neurocore-neural-decoder"
version = "0.1.0"
description = "Neurocore neural decoder"
authors = ["AI Studio <jonnysteedman683@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11"
mcp = { version = ">=1.30,<2", optional = true }

[tool.poetry.extras]
mcp = ["mcp"]

[tool.poetry.scripts]
neurocore-mcp = "neurocore_decoder.mcp_server:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
